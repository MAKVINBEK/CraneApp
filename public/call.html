<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#07070a">
    <title>CraneApp - Звонок</title>
    <script src="/client/mobile/scripts/i18n.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/call.css">
</head>
<body>
    <div class="lobby" id="lobby">
        <h1 id="lobbyTitle" data-i18n="readyToJoin">Готовы присоединиться?</h1>
        <div class="sub" id="lobbySub" data-i18n="checkCameraMic">Проверьте камеру и микрофон</div>
        <div class="preview" id="lobbyPreview">
            <video id="lobbyVideo" autoplay playsinline muted></video>
            <div class="preview-empty" id="lobbyPreviewEmpty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 12h.01"/><path d="M11 12h.01"/><path d="M15 12h.01"/></svg>
                <span data-i18n="cameraOff">Камера выключена</span>
            </div>
        </div>
        <div class="controls">
            <button class="btn-toggle" id="lobbyMicBtn" title="Микрофон" data-i18n-title="microphone">
                <svg id="lobbyMicIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
            </button>
            <button class="btn-toggle" id="lobbyCamBtn" title="Камера" data-i18n-title="camera">
                <svg id="lobbyCamIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            </button>
        </div>
        <div class="lobby-actions">
            <button class="btn-join" id="lobbyJoinBtn" data-i18n="join">Присоединиться</button>
            <button class="btn-leave" id="lobbyLeaveBtn" type="button" data-i18n="leaveMeeting">Выйти</button>
        </div>
        <div class="room-info" id="lobbyInvite">
            <div class="room-info-label" data-i18n="meetingInviteLink">Ссылка на встречу</div>
            <div class="room-info-row">
                <input type="text" class="room-info-url" id="lobbyInviteUrl" readonly value="" aria-label="Meeting invite link" data-i18n-aria-label="meetingInviteLink">
                <button type="button" class="room-info-copy" id="lobbyCopyBtn" title="Скопировать ссылку" data-i18n-title="copyLink">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    <span data-i18n="copyLink">Скопировать</span>
                </button>
            </div>
        </div>
    </div>

    <main class="call" id="callView" style="display:none;">
        <header class="call-header">
            <button class="call-back-btn" id="ctrlBack" title="Вернуться в чат" data-i18n-title="backToChat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                <span data-i18n="chatShort">Чат</span>
            </button>
            <div class="call-meta">
                <div class="call-title" id="callTitle" data-i18n="videoMeeting">Видеовстреча</div>
                <div class="call-time" id="callTime">00:00</div>
            </div>
            <div class="call-badge"><span class="dot"></span><span id="callPeerCount">1</span> <span data-i18n="inCall">в звонке</span></div>
        </header>

        <section class="tiles" id="tiles" data-count="1"></section>

        <div class="controls-bar">
            <div class="volume-control" id="callVolumeControl">
                <button class="control" id="ctrlVolume" data-tip="Громкость" data-i18n-data-tip="volumeSection">
                    <svg id="ctrlVolumeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                </button>
                <div class="volume-panel" id="callVolumePanel">
                    <input type="range" id="callVolumeSlider" min="0" max="100" value="100" aria-label="Call volume">
                    <span id="callVolumeValue">100%</span>
                </div>
            </div>
            <button class="control" id="ctrlMic" data-tip="Микрофон" data-i18n-data-tip="microphone">
                <svg id="ctrlMicIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
            </button>
            <button class="control" id="ctrlCam" data-tip="Камера" data-i18n-data-tip="camera">
                <svg id="ctrlCamIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            </button>
            <button class="control" id="ctrlAddPeer" data-tip="Добавить участника" data-i18n-data-tip="addParticipant">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            </button>
            <button class="control hangup" id="ctrlHangup" data-tip="Завершить" data-i18n-data-tip="hangUp">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7s.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71s-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
            </button>
        </div>
    </main>

    <div class="toast-host"><div class="toast" id="toast"></div></div>

    <script src="/call.js"></script>
</body>
</html>
