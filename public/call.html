<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CraneApp Call</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f1117;
        color: #fff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .call {
        display: grid;
        gap: 16px;
        justify-items: center;
      }

      .pulse {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #1f8fff;
        box-shadow: 0 0 0 0 rgba(31, 143, 255, 0.45);
        animation: pulse 1.8s infinite;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        background: #ff4d4f;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }

      @keyframes pulse {
        to {
          box-shadow: 0 0 0 28px rgba(31, 143, 255, 0);
        }
      }
    </style>
  </head>
  <body>
    <main class="call">
      <div class="pulse" aria-hidden="true"></div>
      <strong id="title">CraneApp</strong>
      <button id="hangup" type="button">Завершить</button>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById('title').textContent = params.get('title') || 'CraneApp';
      document.getElementById('hangup').addEventListener('click', () => {
        parent.postMessage({ type: 'crane_call_ended' }, '*');
      });
      window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'crane_hangup') {
          parent.postMessage({ type: 'crane_call_ended' }, '*');
        }
      });
    </script>
  </body>
</html>
