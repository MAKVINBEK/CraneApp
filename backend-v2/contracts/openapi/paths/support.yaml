/support/requests:
  get: { tags: [Support], summary: List support requests, operationId: listSupportRequests, security: [{ bearerAuth: [] }], responses: { '200': { description: Requests } } }
  post:
    tags: [Support]
    summary: Create a support request
    operationId: createSupportRequest
    security: [{ bearerAuth: [] }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, required: [subject], properties: { subject: { type: string }, message: { type: string } } } } } }
    responses: { '201': { description: Created }, '400': { $ref: '../components/responses.yaml#/Error' } }
/support/requests/{requestId}:
  get: { tags: [Support], summary: Get a support request, operationId: getSupportRequest, security: [{ bearerAuth: [] }], parameters: [{ name: requestId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Request }, '403': { $ref: '../components/responses.yaml#/Error' }, '404': { $ref: '../components/responses.yaml#/Error' } } }
/support/requests/{requestId}/messages:
  get: { tags: [Support], summary: List support messages, operationId: listSupportMessages, security: [{ bearerAuth: [] }], parameters: [{ name: requestId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Messages } } }
/support/requests/{requestId}/reply:
  post: { tags: [Support], summary: Reply to a support request, operationId: replyToSupportRequest, security: [{ bearerAuth: [] }], parameters: [{ name: requestId, in: path, required: true, schema: { type: string, format: uuid } }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [content], properties: { content: { type: string } } } } } }, responses: { '201': { description: Reply created } } }
