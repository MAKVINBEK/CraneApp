pre-commit:
  parallel: true

  jobs:
    - name: Format frontend
      glob: "*.{js,jsx,ts,tsx}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

    - name: Format Go
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true

    - name: Format Rust
      glob: "*.rs"
      run: rustfmt --edition 2021 {staged_files}
      stage_fixed: true
