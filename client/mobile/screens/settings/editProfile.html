<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Редактировать профиль - CraneApp</title>
    <script src="../../scripts/theme.js"></script>
    <style>
        :root {
            --bg-primary: #000000; --bg-secondary: #121212; --bg-tertiary: #1E1E1E;
            --text-primary: #FFFFFF; --text-secondary: #B0B0B0; --text-muted: #666666;
            --border-color: #1E1E1E;
            --accent-color: #FF007F;
            --accent-gradient: linear-gradient(135deg, #FF007F, #9D00FF);
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        }
        [data-theme="light"] {
            --bg-primary: #FFFFFF; --bg-secondary: #F5F5F5; --bg-tertiary: #EEEEEE;
            --text-primary: #000000; --text-secondary: #666666; --text-muted: #999999;
            --border-color: #DDDDDD;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            background: var(--bg-primary); color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh; padding-top: var(--safe-area-top);
            transition: background-color 0.3s, color 0.3s;
        }
        .header {
            padding: 12px 16px; background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .back-btn {
            background: none; border: none; color: var(--text-primary);
            font-size: 22px; cursor: pointer; width: 36px; height: 36px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .back-btn:active { background: rgba(255,255,255,0.1); }
        .header-title { font-size: 17px; font-weight: 700; }
        .save-btn {
            background: none; border: none; color: var(--accent-color);
            font-size: 15px; font-weight: 600; cursor: pointer;
            padding: 6px 14px; border-radius: 8px; white-space: nowrap;
        }
        .save-btn:active { background: rgba(255,0,127,0.1); }
        .save-btn:disabled { opacity: 0.4; cursor: default; }
        .avatar-section {
            display: flex; flex-direction: column; align-items: center;
            padding: 32px 16px 24px; gap: 12px;
        }
        .avatar-wrap { position: relative; cursor: pointer; }
        .avatar {
            width: 96px; height: 96px; border-radius: 50%;
            background: var(--accent-gradient);
            display: flex; align-items: center; justify-content: center;
            font-size: 38px; font-weight: 700; color: #fff;
            overflow: hidden; border: 3px solid var(--accent-color);
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-edit-badge {
            position: absolute; bottom: 2px; right: 2px;
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--accent-gradient);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; border: 2px solid var(--bg-primary);
        }
        .avatar-hint { font-size: 13px; color: var(--accent-color); }
        .form { padding: 0 0 40px; }
        .section-header {
            padding: 16px 16px 8px;
            font-size: 12px; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .section { background: var(--bg-secondary); margin-bottom: 12px; }
        @media (min-width: 768px) { .section { border-radius: 12px; margin: 0 8px 12px; } }
        .field {
            padding: 12px 16px; border-bottom: 1px solid var(--border-color);
            display: flex; flex-direction: column; gap: 4px;
        }
        .field:last-child { border-bottom: none; }
        .field-label { font-size: 12px; color: var(--text-muted); }
        .field-input {
            background: none; border: none; outline: none;
            color: var(--text-primary); font-size: 15px;
            font-family: inherit; width: 100%; resize: none;
        }
        .field-input::placeholder { color: var(--text-muted); }
        .field-counter { font-size: 11px; color: var(--text-muted); text-align: right; }
        .username-row { display: flex; align-items: center; gap: 8px; }
        .username-prefix { color: var(--text-muted); font-size: 15px; }
        .username-status { font-size: 12px; margin-top: 2px; }
        .username-status.ok    { color: #00FF88; }
        .username-status.error { color: #FF4B4B; }
        .username-status.checking { color: var(--text-muted); }
        .danger-btn {
            width: 100%; padding: 14px 16px;
            background: var(--bg-secondary); border: none;
            color: #FF4B4B; font-size: 15px; font-family: inherit;
            cursor: pointer; text-align: left; display: flex; align-items: center; gap: 12px;
        }
        .danger-btn:active { background: var(--bg-tertiary); }
        .toast-container {
            position: fixed; bottom: calc(20px + var(--safe-area-bottom));
            left: 12px; right: 12px; z-index: 9999; pointer-events: none;
        }
        .toast {
            padding: 10px 14px; background: var(--bg-secondary);
            border-radius: 10px; display: flex; align-items: center; gap: 8px;
            animation: slideIn 0.3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            font-size: 13px; margin-bottom: 6px;
        }
        .toast.success { border-left: 4px solid #00FF88; }
        .toast.error   { border-left: 4px solid #FF4B4B; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            z-index: 2000; display: none; align-items: flex-end;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            width: 100%; background: var(--bg-secondary);
            border-radius: 20px 20px 0 0; padding: 20px 16px;
            padding-bottom: calc(20px + var(--safe-area-bottom));
        }
        .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
        .modal-field { background: var(--bg-tertiary); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
        .modal-field label { font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; }
        .modal-field input { background: none; border: none; outline: none; color: var(--text-primary); font-size: 15px; width: 100%; }
        .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
        .btn { flex: 1; padding: 13px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); }
        .btn-primary   { background: var(--accent-gradient); color: #fff; }
        .btn:active { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <div class="modal-overlay" id="pwModal">
        <div class="modal">
            <div class="modal-title">Сменить пароль</div>
            <div class="modal-field">
                <label>Текущий пароль</label>
                <input type="password" id="pwCurrent" placeholder="••••••••">
            </div>
            <div class="modal-field">
                <label>Новый пароль</label>
                <input type="password" id="pwNew" placeholder="••••••••">
            </div>
            <div class="modal-field">
                <label>Повторите новый пароль</label>
                <input type="password" id="pwConfirm" placeholder="••••••••">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closePwModal()">Отмена</button>
                <button class="btn btn-primary" onclick="changePassword()">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="header">
        <div class="header-left">
            <button class="back-btn" onclick="history.back()">←</button>
            <span class="header-title">Редактировать профиль</span>
        </div>
        <button class="save-btn" id="saveBtn" onclick="saveProfile()">Сохранить</button>
    </div>

    <div class="avatar-section">
        <div class="avatar-wrap" onclick="document.getElementById('avatarInput').click()">
            <div class="avatar" id="avatarEl"><span>?</span></div>
            <div class="avatar-edit-badge">📷</div>
        </div>
        <span class="avatar-hint">Изменить фото</span>
        <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarChange(this)">
    </div>

    <div class="form">
        <div class="section-header">Основное</div>
        <div class="section">
            <div class="field">
                <div class="field-label">Имя</div>
                <input class="field-input" id="firstName" placeholder="Введите имя" maxlength="64" oninput="markDirty()">
            </div>
            <div class="field">
                <div class="field-label">Фамилия</div>
                <input class="field-input" id="lastName" placeholder="Необязательно" maxlength="64" oninput="markDirty()">
            </div>
            <div class="field">
                <div class="field-label">Юзернейм</div>
                <div class="username-row">
                    <span class="username-prefix">@</span>
                    <input class="field-input" id="username" placeholder="username" maxlength="32"
                        oninput="markDirty(); scheduleUsernameCheck()">
                </div>
                <div class="username-status" id="usernameStatus"></div>
            </div>
        </div>

        <div class="section-header">О себе</div>
        <div class="section">
            <div class="field">
                <div class="field-label">Биография</div>
                <textarea class="field-input" id="bio" placeholder="Расскажите о себе..." maxlength="200" rows="3"
                    oninput="markDirty(); updateBioCounter()"></textarea>
                <div class="field-counter"><span id="bioCounter">0</span>/200</div>
            </div>
        </div>

        <div class="section-header">Безопасность</div>
        <div class="section">
            <button class="danger-btn" onclick="openPwModal()">
                <span>🔑</span><span>Сменить пароль</span>
            </button>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('craneapp_auth_token');
        if (!token) window.location.href = '../auth/login.html';

        let originalData = {};
        let isDirty = false;
        let newAvatarBase64 = null;
        let usernameCheckTimer = null;
        let usernameValid = true;

        async function loadProfile() {
            try {
                const res = await fetch('/api/v1/users/me', { headers: { 'Authorization': 'Bearer ' + token } });
                if (!res.ok) throw new Error();
                const { user: u } = await res.json();
                originalData = { firstName: u.firstName||'', lastName: u.lastName||'', username: u.username||'', bio: u.bio||'', avatarUrl: u.avatarUrl||'' };
            } catch (e) {
                const u = JSON.parse(localStorage.getItem('craneapp_user_data') || '{}');
                originalData = { firstName: u.firstName||'', lastName: u.lastName||'', username: u.username||'', bio: u.bio||'', avatarUrl: u.avatarUrl||'' };
            }
            document.getElementById('firstName').value = originalData.firstName;
            document.getElementById('lastName').value  = originalData.lastName;
            document.getElementById('username').value  = originalData.username;
            document.getElementById('bio').value       = originalData.bio;
            updateBioCounter();
            renderAvatar(originalData.avatarUrl, originalData.firstName);
        }

        function renderAvatar(url, name) {
            const el = document.getElementById('avatarEl');
            el.innerHTML = (url && (url.startsWith('http') || url.startsWith('data:') || url.startsWith('/')))
                ? `<img src="${url}" alt="">`
                : `<span>${(name || '?')[0].toUpperCase()}</span>`;
        }

        function updateBioCounter() {
            document.getElementById('bioCounter').textContent = document.getElementById('bio').value.length;
        }

        function markDirty() { isDirty = true; }

        function handleAvatarChange(input) {
            const file = input.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { showToast('error', 'Файл слишком большой (макс. 5 МБ)', '❌'); return; }
            const reader = new FileReader();
            reader.onload = e => { newAvatarBase64 = e.target.result; renderAvatar(newAvatarBase64, ''); markDirty(); };
            reader.readAsDataURL(file);
        }

        function scheduleUsernameCheck() {
            clearTimeout(usernameCheckTimer);
            const val = document.getElementById('username').value.trim();
            const statusEl = document.getElementById('usernameStatus');
            if (!val || val === originalData.username) { statusEl.textContent = ''; usernameValid = true; return; }
            if (!/^[a-zA-Z0-9_]{3,32}$/.test(val)) {
                statusEl.textContent = 'Только буквы, цифры и _ (3–32 символа)';
                statusEl.className = 'username-status error'; usernameValid = false; return;
            }
            statusEl.textContent = 'Проверяем...'; statusEl.className = 'username-status checking';
            usernameCheckTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`/api/v1/users/check-username?username=${encodeURIComponent(val)}`, { headers: { 'Authorization': 'Bearer ' + token } });
                    if (res.ok) {
                        const d = await res.json();
                        statusEl.textContent = d.available ? '✓ Доступен' : 'Уже занят';
                        statusEl.className = 'username-status ' + (d.available ? 'ok' : 'error');
                        usernameValid = d.available;
                    }
                } catch (_) { statusEl.textContent = ''; usernameValid = true; }
            }, 600);
        }

        async function saveProfile() {
            if (!isDirty && !newAvatarBase64) return;
            if (!usernameValid) { showToast('error', 'Юзернейм недоступен', '❌'); return; }
            const firstName = document.getElementById('firstName').value.trim();
            if (!firstName) { showToast('error', 'Имя не может быть пустым', '❌'); return; }

            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.textContent = 'Сохранение...';

            const body = { firstName, lastName: document.getElementById('lastName').value.trim(), bio: document.getElementById('bio').value.trim() };
            const newUsername = document.getElementById('username').value.trim();
            if (newUsername && newUsername !== originalData.username) body.username = newUsername;
            if (newAvatarBase64) body.avatar = newAvatarBase64;

            try {
                const res = await fetch('/api/v1/users/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (res.ok) {
                    const cached = JSON.parse(localStorage.getItem('craneapp_user_data') || '{}');
                    localStorage.setItem('craneapp_user_data', JSON.stringify({ ...cached, ...data.user }));
                    originalData = { firstName: data.user.firstName, lastName: data.user.lastName, username: data.user.username, bio: data.user.bio, avatarUrl: data.user.avatarUrl };
                    newAvatarBase64 = null; isDirty = false;
                    showToast('success', 'Профиль сохранён', '✓');
                    setTimeout(() => history.back(), 1000);
                } else {
                    showToast('error', data.error || 'Ошибка сохранения', '❌');
                }
            } catch (e) {
                showToast('error', 'Ошибка сети', '❌');
            } finally {
                btn.disabled = false; btn.textContent = 'Сохранить';
            }
        }

        function openPwModal()  { document.getElementById('pwModal').classList.add('active'); }
        function closePwModal() {
            document.getElementById('pwModal').classList.remove('active');
            ['pwCurrent','pwNew','pwConfirm'].forEach(id => document.getElementById(id).value = '');
        }

        async function changePassword() {
            const current = document.getElementById('pwCurrent').value;
            const newPw   = document.getElementById('pwNew').value;
            const confirm = document.getElementById('pwConfirm').value;
            if (!current || !newPw) { showToast('error', 'Заполните все поля', '❌'); return; }
            if (newPw.length < 6)   { showToast('error', 'Пароль минимум 6 символов', '❌'); return; }
            if (newPw !== confirm)   { showToast('error', 'Пароли не совпадают', '❌'); return; }
            try {
                const res = await fetch('/api/v1/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ currentPassword: current, newPassword: newPw })
                });
                const data = await res.json();
                if (res.ok) { closePwModal(); showToast('success', 'Пароль изменён', '✓'); }
                else showToast('error', data.error || 'Ошибка', '❌');
            } catch (e) { showToast('error', 'Ошибка сети', '❌'); }
        }

        function showToast(type, message, icon) {
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.innerHTML = `<span>${icon}</span><span>${message}</span>`;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity 0.3s'; setTimeout(()=>t.remove(),300); }, 2500);
        }

        document.getElementById('pwModal').addEventListener('click', e => { if (e.target===e.currentTarget) closePwModal(); });

        loadProfile();
        if (window.applyTheme) window.applyTheme();
    </script>
</body>
</html>
