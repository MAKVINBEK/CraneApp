<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Избранное - CraneApp</title>
    <script src="/client/mobile/scripts/i18n.js"></script>
    <script src="/client/mobile/scripts/theme.js"></script>
    <link rel="stylesheet" href="../chats/chats.css">
    <link rel="stylesheet" href="./favorites.css">
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>
    
    <div class="chat-view" id="chatView">
        <div class="chat-header" id="chatHeader">
            <div class="chat-header-left">
                <button class="back-btn" onclick="history.back()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <div class="chat-info">
                    <div class="chat-name">Избранное</div>
                    <div class="chat-status">Личные заметки</div>
                </div>
            </div>
            <div class="chat-header-right">
                <button class="header-btn" id="searchBtn" onclick="toggleSearch()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                </button>
                <button class="header-btn" id="moreBtn" onclick="showMoreOptions()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="1"/>
                        <circle cx="12" cy="5" r="1"/>
                        <circle cx="12" cy="19" r="1"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Поиск -->
        <div class="search-bar" id="searchBar" style="display: none;">
            <input type="text" class="search-input" id="searchInput" placeholder="Поиск в избранных...">
            <button class="search-clear-btn" onclick="clearSearch()">×</button>
        </div>
        
        <!-- Сообщения -->
        <div class="messages" id="messages">
            <div class="system-message">
                <div class="system-text">📝 Ваши личные заметки</div>
                <div class="system-subtext">Сохраняйте важные мысли, идеи и ссылки здесь</div>
            </div>
        </div>
        
        <!-- Панель ввода -->
        <div class="input-panel" id="inputPanel">
            <div class="input-wrapper">
                <button class="attach-btn" onclick="openAttachmentPanel()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                    </svg>
                </button>
                <div class="input-container">
                    <div class="message-input" id="msgInput" contenteditable="true" data-placeholder="Заметка для себя..." data-i18n-placeholder="favoritePlaceholder"></div>
                    <button class="emoji-btn" onclick="toggleEmojiPicker()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                            <line x1="9" y1="9" x2="9.01" y2="9"/>
                            <line x1="15" y1="9" x2="15.01" y2="9"/>
                        </svg>
                    </button>
                </div>
                <button class="send-btn" id="sendBtn" onclick="sendFavorite()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Панель вложений -->
    <div class="attachment-panel" id="attachmentPanel" style="display: none;">
        <div class="attachment-options">
            <button class="attachment-btn" onclick="document.getElementById('photoInput').click()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                <span>Фото</span>
            </button>
            <button class="attachment-btn" onclick="document.getElementById('fileInput').click()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
                    <polyline points="13 2 13 9 20 9"/>
                </svg>
                <span>Файл</span>
            </button>
            <button class="attachment-btn" onclick="startVoiceRecording()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
                <span>Голос</span>
            </button>
        </div>
    </div>

    <!-- Скрытые инпуты для файлов -->
    <input type="file" id="photoInput" accept="image/*" style="display: none;" onchange="handlePhotoSelect(event)">
    <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect(event)">

    <script src="./favorites.js"></script>
</body>
</html>
