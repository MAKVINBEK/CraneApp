<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Папки — CraneApp</title>
<script src="../../scripts/theme.js"></script>
<style>
:root{
  --bg:#000;--s1:#111;--s2:#1c1c1c;--s3:#252525;
  --t:#fff;--t2:#888;--t3:#444;
  --b:rgba(255,255,255,.08);
  --a:#FF007F;--g:linear-gradient(135deg,#FF007F,#9D00FF);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{--bg:#f2f2f7;--s1:#fff;--s2:#f5f5f5;--s3:#e8e8e8;--t:#000;--t2:#666;--t3:#bbb;--b:rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{color:var(--t);font-family:-apple-system,system-ui,sans-serif;min-height:100vh;padding-top:var(--sat);-webkit-user-select:none;user-select:none}

.hdr{height:52px;padding:0 8px 0 4px;background:var(--bg);display:flex;align-items:center;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--b)}
.back{background:none;border:none;color:var(--t);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px}
.back:active{background:var(--s2)}
.hdr-title{font-size:17px;font-weight:700;flex:1;padding-left:2px}

/* ── VIEWS ── */
#listView,#editView{display:block}
#editView{display:none}

/* ── SECTION ── */
.sec{background:var(--s1);border-radius:14px;margin:12px;overflow:hidden}
.sec+.sec{margin-top:0}
.row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--b);cursor:pointer;gap:14px}
.row:last-child{border-bottom:none}
.row:active{background:var(--s2)}
.ri{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.rt{flex:1;min-width:0}
.rn{font-size:15px;font-weight:500}
.rs{font-size:12px;color:var(--t2);margin-top:2px}
.ra{color:var(--t3);font-size:20px;line-height:1}
.hint{font-size:13px;color:var(--t2);padding:6px 16px 20px;line-height:1.5}

/* ── EDIT ── */
.eb{padding:0 0 calc(40px + var(--sab))}
.esl{font-size:12px;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;padding:16px 16px 6px;font-weight:600}
.esec{background:var(--s1);border-radius:14px;margin:0 12px;overflow:hidden}
.er{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--b);gap:12px}
.er:last-child{border-bottom:none}
.el{font-size:15px;color:var(--t2);flex-shrink:0;width:76px}
.ei{flex:1;background:none;border:none;color:var(--t);font-size:15px;outline:none;-webkit-user-select:text;user-select:text}
.ei::placeholder{color:var(--t3)}

/* icon row */
.irow{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap}
.ico{width:42px;height:42px;border-radius:11px;background:var(--s2);border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.ico.sel{border-color:var(--a);background:rgba(255,0,127,.1)}

/* color row */
.crow{display:flex;gap:10px;padding:12px 16px;flex-wrap:wrap}
.col{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;position:relative;transition:transform .15s}
.col.sel{border-color:var(--t);transform:scale(1.18)}
.col.sel::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}

/* chat list */
.clist{background:var(--s1);border-radius:14px;margin:0 12px;overflow:hidden;max-height:320px;overflow-y:auto}
.ci{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--b);cursor:pointer}
.ci:last-child{border-bottom:none}
.ci:active{background:var(--s2)}
.ci.on{background:rgba(255,0,127,.06)}
.cav{width:40px;height:40px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.cav img{width:100%;height:100%;object-fit:cover}
.cn{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck{width:22px;height:22px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700;flex-shrink:0}

/* buttons */
.bwrap{padding:16px 12px 8px}
.bsave{width:100%;padding:14px;border-radius:13px;border:none;background:var(--g);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.bsave:active{opacity:.85}
.bdel{width:100%;padding:14px;border-radius:13px;border:none;background:rgba(255,75,75,.1);color:#FF4B4B;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px}
.bdel:active{background:rgba(255,75,75,.18)}

/* toast */
.toasts{position:fixed;bottom:calc(20px + var(--sab));left:12px;right:12px;z-index:999;pointer-events:none}
.toast{padding:11px 14px;background:var(--s1);border-radius:11px;display:flex;align-items:center;gap:8px;animation:tup .25s ease;box-shadow:0 4px 24px rgba(0,0,0,.4);font-size:14px;margin-top:6px;border:1px solid var(--b)}
@keyframes tup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="toasts" id="toasts"></div>

<!-- LIST VIEW -->
<div id="listView">
  <div class="hdr">
    <button class="back" onclick="history.back()">←</button>
    <span class="hdr-title">Папки с чатами</span>
  </div>
  <div style="height:12px"></div>
  <div class="sec" id="folderSec"></div>
  <div class="hint" id="listHint">Папки отображаются как вкладки в списке чатов. Нажмите на папку чтобы открыть её в чатах.</div>
</div>

<!-- EDIT VIEW -->
<div id="editView">
  <div class="hdr">
    <button class="back" onclick="backToList()">←</button>
    <span class="hdr-title" id="editTitle">Новая папка</span>
  </div>
  <div class="eb">
    <div class="esl">Название</div>
    <div class="esec">
      <div class="er">
        <input class="ei" id="fName" placeholder="Например: Работа" maxlength="24" autocomplete="off">
      </div>
    </div>

    <div class="esl">Иконка</div>
    <div class="esec"><div class="irow" id="iconRow"></div></div>

    <div class="esl">Цвет</div>
    <div class="esec"><div class="crow" id="colorRow"></div></div>

    <div class="esl">Чаты в папке</div>
    <div class="clist" id="chatList"></div>

    <div class="bwrap">
      <button class="bsave" onclick="saveFolder()">Сохранить</button>
      <button class="bdel" id="btnDel" style="display:none" onclick="deleteFolder()">Удалить папку</button>
    </div>
  </div>
</div>

<script>
const token = localStorage.getItem('craneapp_auth_token');
if (!token) location.href = '../auth/login.html';

const ICONS  = ['📁','💬','👥','⭐','🔔','📌','🏠','💼','🎮','🎵','📸','🎬','❤️','🚀'];
const COLORS = ['#FF007F','#9D00FF','#0088FF','#00C864','#FF8800','#FF4B4B','#00C8C8','#FFD700'];

let folders=[], allChats=[], editId=null, selIcon='📁', selColor='#FF007F', selChats=new Set();

async function init() {
  folders = JSON.parse(localStorage.getItem('craneapp_folders')||'[]');
  renderList();
  await Promise.all([syncFolders(), loadChats()]);
  renderList();
}

async function syncFolders() {
  try {
    const r = await fetch('/api/v1/users/all-settings',{headers:{Authorization:'Bearer '+token}});
    if(r.ok){const d=await r.json();if(d.folders?.length){folders=d.folders;localStorage.setItem('craneapp_folders',JSON.stringify(folders));}}
  }catch(_){}
}

async function loadChats() {
  try {
    const r = await fetch('/api/v1/chats',{headers:{Authorization:'Bearer '+token}});
    if(!r.ok)return;
    const d = await r.json();
    const myId = JSON.parse(localStorage.getItem('craneapp_user_data')||'{}').id;
    allChats = await Promise.all((d.chats||[]).map(async c=>{
      if(c.type==='private'){
        try{
          const mr=await fetch('/api/v1/chats/'+c.id+'/members',{headers:{Authorization:'Bearer '+token}});
          if(mr.ok){const md=await mr.json();const o=(md.members||[]).find(m=>m.id!==myId);if(o)return{...c,name:((o.first_name||'')+' '+(o.last_name||'')).trim()||o.username||'Пользователь',avatarUrl:o.avatar_url||''};}
        }catch(_){}
      }
      return{...c,name:c.title||'Чат'};
    }));
  }catch(_){}
}

function renderList() {
  const sec = document.getElementById('folderSec');
  const hint = document.getElementById('listHint');
  let html = '';

  folders.forEach(f=>{
    const n=(f.chatIds||[]).length;
    html+='<div class="row" onclick="openEdit(\''+f.id+'\')"><div class="ri" style="background:'+f.color+'22">'+f.icon+'</div><div class="rt"><div class="rn">'+esc(f.name)+'</div><div class="rs">'+n+'\u00a0'+plural(n)+'</div></div><span class="ra">›</span></div>';
  });

  html+='<div class="row" onclick="openEdit(null)"><div class="ri" style="background:rgba(255,0,127,.15);color:var(--a);font-size:22px;font-weight:300">+</div><div class="rt"><div class="rn" style="color:var(--a)">Создать папку</div></div></div>';

  sec.innerHTML = html;
  hint.textContent = folders.length ? 'Папки отображаются как вкладки в списке чатов.' : '';
}

function openEdit(folderId) {
  editId = folderId;
  const f = folderId ? folders.find(x=>x.id===folderId) : null;
  selIcon  = f?.icon  || '📁';
  selColor = f?.color || '#FF007F';
  selChats = new Set(f?.chatIds||[]);

  document.getElementById('editTitle').textContent = f ? 'Редактировать' : 'Новая папка';
  document.getElementById('fName').value = f?.name||'';
  document.getElementById('btnDel').style.display = f ? 'block' : 'none';

  renderIcons(); renderColors(); renderChatList();

  document.getElementById('listView').style.display = 'none';
  document.getElementById('editView').style.display = 'block';
  window.scrollTo(0,0);
  setTimeout(()=>document.getElementById('fName').focus(),200);
}

function backToList() {
  document.getElementById('editView').style.display = 'none';
  document.getElementById('listView').style.display = 'block';
  window.scrollTo(0,0);
}

function renderIcons() {
  document.getElementById('iconRow').innerHTML = ICONS.map(i=>'<div class="ico'+(i===selIcon?' sel':'')+'" onclick="pickIcon(\''+i+'\')">'+i+'</div>').join('');
}
function renderColors() {
  document.getElementById('colorRow').innerHTML = COLORS.map(c=>'<div class="col'+(c===selColor?' sel':'')+'" style="background:'+c+'" onclick="pickColor(\''+c+'\')"></div>').join('');
}
function renderChatList() {
  const el = document.getElementById('chatList');
  if(!allChats.length){el.innerHTML='<div style="padding:14px 16px;color:var(--t3);font-size:14px">Нет доступных чатов</div>';return;}
  el.innerHTML = allChats.map(c=>{
    const n=c.name||'Чат', on=selChats.has(c.id);
    const av=isUrl(c.avatarUrl)?'<img src="'+esc(c.avatarUrl)+'" alt="">':n[0].toUpperCase();
    return '<div class="ci'+(on?' on':'')+'" onclick="toggleChat(\''+c.id+'\')"><div class="cav">'+av+'</div><span class="cn">'+esc(n)+'</span>'+(on?'<div class="ck">✓</div>':'')+'</div>';
  }).join('');
}

function pickIcon(i){selIcon=i;renderIcons();}
function pickColor(c){selColor=c;renderColors();}
function toggleChat(id){selChats.has(id)?selChats.delete(id):selChats.add(id);renderChatList();}

async function saveFolder() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { toast('Введите название', true); return; }
  const chatIds = [...selChats];

  // Если 0 чатов — автоудаление
  if (chatIds.length === 0) {
    if (editId) {
      folders = folders.filter(x => x.id !== editId);
      await persist();
      backToList();
      renderList();
      toast('Папка удалена (нет чатов)');
    } else {
      toast('Добавьте хотя бы один чат', true);
    }
    return;
  }

  const data = { id: editId || ('f' + Date.now()), name, icon: selIcon, color: selColor, chatIds };
  if (editId) { const i = folders.findIndex(x => x.id === editId); if (i >= 0) folders[i] = data; else folders.push(data); }
  else folders.push(data);
  await persist();
  backToList();
  renderList();
  toast(editId ? 'Папка обновлена' : 'Папка создана');
}

async function deleteFolder() {
  const f=folders.find(x=>x.id===editId);
  if(!confirm('Удалить папку «'+(f?.name||'')+'»?'))return;
  folders=folders.filter(x=>x.id!==editId);
  await persist();
  backToList();
  renderList();
  toast('Папка удалена');
}

async function persist() {
  localStorage.setItem('craneapp_folders',JSON.stringify(folders));
  try{await fetch('/api/v1/users/all-settings',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({folders})});}catch(_){}
}

function isUrl(u){return u&&(u.startsWith('http')||u.startsWith('/')||u.startsWith('data:'));}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function plural(n){if(n%10===1&&n%100!==11)return'чат';if([2,3,4].includes(n%10)&&![12,13,14].includes(n%100))return'чата';return'чатов';}
function toast(msg,err){const t=document.createElement('div');t.className='toast';t.innerHTML='<span>'+(err?'⚠️':'✓')+'</span><span>'+msg+'</span>';document.getElementById('toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .25s';setTimeout(()=>t.remove(),250);},2200);}

init();
</script>
</body>
</html>
