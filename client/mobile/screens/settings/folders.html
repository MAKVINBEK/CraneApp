<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title data-i18n="foldersTitleFull">Folders - CraneApp</title>
<script src="/client/mobile/scripts/i18n.js"></script>
<script src="/client/mobile/scripts/theme.js"></script>
<link rel="stylesheet" href="./folders.css">
</head>
<body>
<div class="toasts" id="toasts"></div>

<div id="listView">
  <div class="hdr">
    <button class="back" onclick="history.back()" data-i18n-aria-label="back">←</button>
    <span class="hdr-title" data-i18n="foldersTitle">Chat folders</span>
  </div>
  <div style="height:12px"></div>
  <div class="sec" id="folderSec"></div>
  <div class="hint" id="listHint" data-i18n="folderHintLong">Folders are displayed as tabs in the chat list. Tap a folder to open it in chats.</div>
</div>

<div id="editView">
  <div class="hdr">
    <button class="back" onclick="backToList()" data-i18n-aria-label="back">←</button>
    <span class="hdr-title" id="editTitle" data-i18n="newFolder">New folder</span>
  </div>
  <div class="eb">
    <div class="esl" data-i18n="folderName">Name</div>
    <div class="esec">
      <div class="er">
        <input class="ei" id="fName" data-i18n-placeholder="folderNameExample" placeholder="Example: Work" maxlength="24" autocomplete="off">
      </div>
    </div>

    <div class="esl" data-i18n="folderIcon">Icon</div>
    <div class="esec"><div class="irow" id="iconRow"></div></div>

    <div class="esl" data-i18n="folderColor">Color</div>
    <div class="esec"><div class="crow" id="colorRow"></div></div>

    <div class="esl" data-i18n="folderChats">Chats in folder</div>
    <div class="clist" id="chatList"></div>

    <div class="bwrap">
      <button class="bsave" onclick="saveFolder()" data-i18n="save">Save</button>
      <button class="bdel" id="btnDel" style="display:none" onclick="deleteFolder()" data-i18n="deleteFolder">Delete folder</button>
    </div>
  </div>
</div>

<script src="./folders.js"></script>
</body>
</html>
