<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Язык - CraneApp</title>
    <script src="/client/mobile/scripts/i18n.js"></script>
    <script src="/client/mobile/scripts/theme.js"></script>
    <link rel="stylesheet" href="./language.css">
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <div class="header">
        <button class="back-btn" onclick="history.back()">←</button>
        <span class="header-title" id="headerTitle" data-i18n="language">Language</span>
    </div>

    <div class="search-bar">
        <div class="search-inner">
            <input class="search-input" type="search" placeholder="" id="searchInput" oninput="render(this.value)" autocomplete="off">
        </div>
    </div>

    <div class="content" id="content"></div>

    <script src="./language.js"></script>
</body>
</html>
