<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Просмотр - CraneApp</title>
    <style>
        :root {
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --accent: #FF007F;
            --bg: #000000;
            --text: #FFFFFF;
            --text-secondary: #B0B0B0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            touch-action: pan-y;
        }

        /* Container */
        .viewer-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Media Content */
        .media-wrapper {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .media-content {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        .media-content.zoomable {
            cursor: zoom-in;
            transform-origin: center center;
        }

        .media-content.zoomable.zoomed {
            cursor: zoom-out;
            transform: scale(2);
        }

        /* Video */
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-element {
            max-width: 100%;
            max-height: 100%;
            background: #000;
        }

        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            padding-bottom: calc(16px + var(--safe-area-bottom));
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .video-wrapper:hover .video-controls,
        .video-controls.visible {
            opacity: 1;
        }

        .video-progress {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .video-progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s;
        }

        .video-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .video-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 28px;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .video-btn:active {
            transform: scale(0.8);
        }

        .video-time {
            font-size: 13px;
            color: var(--text-secondary);
            position: absolute;
            left: 16px;
            bottom: 70px;
        }

        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Header */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px;
            padding-top: calc(12px + var(--safe-area-top));
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .header-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text);
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            backdrop-filter: blur(10px);
        }

        .header-btn:active {
            background: rgba(255,255,255,0.2);
        }

        .header-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Caption */
        .caption {
            position: absolute;
            bottom: 80px;
            left: 0;
            right: 0;
            padding: 16px;
            padding-bottom: calc(16px + var(--safe-area-bottom));
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            font-size: 15px;
            line-height: 1.5;
            display: none;
        }

        .caption.visible {
            display: block;
        }

        /* Actions Bar */
        .actions-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            padding-bottom: calc(16px + var(--safe-area-bottom));
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            transition: all 0.2s;
        }

        .action-btn:active {
            transform: scale(0.9);
        }

        .action-btn span {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .action-btn.danger:active {
            color: #FF4B4B;
        }

        /* Fullscreen */
        .fullscreen-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-video.active {
            display: flex;
        }

        .fullscreen-video video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .fullscreen-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: #fff;
            font-size: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10001;
        }

        /* Double tap to zoom */
        .media-wrapper[data-dbltap="1"] .media-content {
            animation: doubleTapZoom 0.3s ease;
        }

        @keyframes doubleTapZoom {
            0% { transform: scale(1); }
            50% { transform: scale(2.5); }
            100% { transform: scale(2); }
        }

        /* Sticker mode */
        .sticker-viewer .media-content {
            max-width: 80%;
            max-height: 80%;
        }

        /* Navigation dots for galleries */
        .gallery-dots {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 50;
        }

        .gallery-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            transition: all 0.3s;
        }

        .gallery-dot.active {
            background: var(--accent);
            width: 24px;
            border-radius: 4px;
        }

        /* Share sheet */
        .share-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            display: none;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: var(--safe-area-bottom);
        }

        .share-overlay.active {
            display: flex;
        }

        .share-sheet {
            background: #1E1E1E;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .share-sheet-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
        }

        .share-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .share-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            border-radius: 12px;
            transition: background 0.2s;
        }

        .share-option:active {
            background: rgba(255,255,255,0.1);
        }

        .share-option-icon {
            font-size: 28px;
        }

        .share-option-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .share-cancel {
            margin-top: 16px;
            width: 100%;
            padding: 14px;
            background: #333;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }

        .share-cancel:active {
            background: #444;
        }
    </style>
</head>
<body>
    <div class="viewer-container" id="viewerContainer">
        <!-- Header -->
        <div class="header">
            <button class="header-btn" onclick="closeViewer()" title="Закрыть">✕</button>
            <div class="header-title" id="headerTitle">Медиа</div>
            <button class="header-btn" onclick="showShareSheet()" title="Поделиться">📤</button>
        </div>

        <!-- Media Content -->
        <div class="media-wrapper" id="mediaWrapper">
            <div class="loading" id="loadingIndicator">
                <div class="spinner"></div>
                <div class="loading-text">Загрузка...</div>
            </div>
            
            <img class="media-content zoomable" id="imageContent" style="display:none" alt="Media">
            <video class="media-content" id="videoContent" style="display:none" playsinline></video>
        </div>

        <!-- Video Progress & Time -->
        <div class="video-time" id="videoTime" style="display:none">0:00 / 0:00</div>

        <!-- Gallery Dots -->
        <div class="gallery-dots" id="galleryDots" style="display:none"></div>

        <!-- Caption -->
        <div class="caption" id="caption"></div>

        <!-- Fullscreen Video -->
        <div class="fullscreen-video" id="fullscreenVideo">
            <button class="fullscreen-close" onclick="toggleFullscreen()">✕</button>
            <video id="fullscreenVideoElement" playsinline></video>
        </div>

        <!-- Share Sheet -->
        <div class="share-overlay" id="shareOverlay" onclick="hideShareSheet(event)">
            <div class="share-sheet" onclick="event.stopPropagation()">
                <div class="share-sheet-title">Поделиться</div>
                <div class="share-options">
                    <button class="share-option" onclick="shareVia('messages')">
                        <span class="share-option-icon">💬</span>
                        <span class="share-option-label">Чат</span>
                    </button>
                    <button class="share-option" onclick="shareVia('story')">
                        <span class="share-option-icon">📱</span>
                        <span class="share-option-label">История</span>
                    </button>
                    <button class="share-option" onclick="shareVia('copy')">
                        <span class="share-option-icon">📋</span>
                        <span class="share-option-label">Копировать</span>
                    </button>
                    <button class="share-option" onclick="shareVia('save')">
                        <span class="share-option-icon">⬇️</span>
                        <span class="share-option-label">Сохранить</span>
                    </button>
                </div>
                <button class="share-cancel" onclick="hideShareSheet()">Отмена</button>
            </div>
        </div>

        <!-- Actions Bar -->
        <div class="actions-bar">
            <button class="action-btn" onclick="replyToMedia()">
                ↩️<span>Ответить</span>
            </button>
            <button class="action-btn" onclick="showShareSheet()">
                ⏩<span>Переслать</span>
            </button>
            <button class="action-btn" onclick="saveMedia()">
                ⬇️<span>Сохранить</span>
            </button>
            <button class="action-btn danger" onclick="deleteMedia()">
                🗑️<span>Удалить</span>
            </button>
        </div>
    </div>

    <script>
        // State
        let currentMedia = null;
        let isZoomed = false;
        let touchStartX = 0, touchStartY = 0;
        let touchStartTime = 0;
        let lastTap = 0;

        // Get params
        const urlParams = new URLSearchParams(window.location.search);
        const mediaUrl = urlParams.get('url');
        const mediaType = urlParams.get('type') || 'image';
        const caption = urlParams.get('caption') || '';
        const messageId = urlParams.get('messageId');
        const chatId = urlParams.get('chatId');
        const senderName = urlParams.get('sender') || '';

        // Elements
        const imageContent = document.getElementById('imageContent');
        const videoContent = document.getElementById('videoContent');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const captionEl = document.getElementById('caption');
        const mediaWrapper = document.getElementById('mediaWrapper');
        const videoTime = document.getElementById('videoTime');
        const headerTitle = document.getElementById('headerTitle');

        // Initialize
        function init() {
            currentMedia = {
                url: mediaUrl,
                type: mediaType,
                caption: caption,
                messageId: messageId,
                chatId: chatId
            };

            // Set title
            headerTitle.textContent = senderName || getMediaTypeName(mediaType);

            // Show caption
            if (caption) {
                captionEl.textContent = caption;
                captionEl.classList.add('visible');
            }

            // Load media based on type
            if (mediaType === 'video' || mediaType === 'gif') {
                loadVideo(mediaUrl, mediaType === 'gif');
            } else {
                loadImage(mediaUrl);
            }

            setupGestures();
        }

        function getMediaTypeName(type) {
            const names = {
                image: 'Фото',
                photo: 'Фото',
                video: 'Видео',
                gif: 'GIF',
                sticker: 'Стикер'
            };
            return names[type] || 'Медиа';
        }

        // Load image
        function loadImage(url) {
            imageContent.style.display = 'block';
            videoContent.style.display = 'none';
            
            if (url) {
                imageContent.src = url;
                imageContent.onload = () => {
                    loadingIndicator.style.display = 'none';
                };
                imageContent.onerror = () => {
                    loadingIndicator.querySelector('.loading-text').textContent = 'Ошибка загрузки';
                };
            } else {
                // Demo mode
                imageContent.src = 'https://via.placeholder.com/800x600/1E1E1E/FF007F?text=CraneApp+Media';
                loadingIndicator.style.display = 'none';
            }
        }

        // Load video
        function loadVideo(url, isGif = false) {
            imageContent.style.display = 'none';
            videoContent.style.display = 'block';
            videoTime.style.display = isGif ? 'none' : 'block';

            if (url) {
                videoContent.src = url;
                videoContent.loop = isGif;
                videoContent.muted = isGif; // Auto-play GIFs muted
                videoContent.playsInline = true;
                
                videoContent.onloadedmetadata = () => {
                    loadingIndicator.style.display = 'none';
                    updateVideoTime();
                    
                    if (isGif) {
                        videoContent.play().catch(() => {});
                    }
                };
                
                videoContent.onerror = () => {
                    loadingIndicator.querySelector('.loading-text').textContent = 'Ошибка загрузки';
                };

                // Video controls
                if (!isGif) {
                    setupVideoControls();
                }
            } else {
                // Demo mode
                videoContent.src = 'https://www.w3schools.com/html/mov_bbb.mp4';
                loadingIndicator.style.display = 'none';
            }
        }

        // Video controls
        function setupVideoControls() {
            videoContent.addEventListener('click', togglePlayPause);
            videoContent.addEventListener('timeupdate', updateVideoProgress);
            videoContent.addEventListener('ended', () => {
                videoContent.currentTime = 0;
            });

            // Show controls on tap
            videoContent.addEventListener('click', () => {
                const controls = document.querySelector('.video-controls');
                controls.classList.add('visible');
                setTimeout(() => {
                    controls.classList.remove('visible');
                }, 3000);
            });
        }

        function togglePlayPause() {
            if (videoContent.paused) {
                videoContent.play();
            } else {
                videoContent.pause();
            }
        }

        function updateVideoProgress() {
            const percent = (videoContent.currentTime / videoContent.duration) * 100;
            
            // Create progress bar if not exists
            let progress = document.querySelector('.video-progress');
            if (!progress) {
                createVideoControls();
            }
            
            const fill = document.querySelector('.video-progress-fill');
            if (fill) {
                fill.style.width = percent + '%';
            }
            
            updateVideoTime();
        }

        function createVideoControls() {
            const container = document.getElementById('viewerContainer');
            
            const progress = document.createElement('div');
            progress.className = 'video-progress';
            progress.innerHTML = '<div class="video-progress-fill"></div>';
            progress.onclick = seekVideo;
            container.appendChild(progress);

            const buttons = document.createElement('div');
            buttons.className = 'video-controls visible';
            buttons.innerHTML = `
                <div class="video-buttons">
                    <button class="video-btn" onclick="togglePlayPause()">⏮</button>
                    <button class="video-btn" onclick="togglePlayPause()" id="playPauseBtn">⏸</button>
                    <button class="video-btn" onclick="togglePlayPause()">⏭</button>
                    <button class="video-btn" onclick="toggleFullscreen()">⛶</button>
                </div>
            `;
            container.appendChild(buttons);
        }

        function updateVideoTime() {
            const current = formatTime(videoContent.currentTime || 0);
            const total = formatTime(videoContent.duration || 0);
            videoTime.textContent = `${current} / ${total}`;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function seekVideo(e) {
            const rect = e.target.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            videoContent.currentTime = percent * videoContent.duration;
        }

        function toggleFullscreen() {
            const fullscreen = document.getElementById('fullscreenVideo');
            const fullscreenVideo = document.getElementById('fullscreenVideoElement');
            
            if (fullscreen.classList.contains('active')) {
                fullscreen.classList.remove('active');
                fullscreenVideo.pause();
                fullscreenVideo.src = '';
            } else {
                fullscreenVideo.src = videoContent.src;
                fullscreen.classList.add('active');
                fullscreenVideo.play();
                
                // Exit fullscreen on back gesture
                fullscreenVideo.addEventListener('ended', () => {
                    fullscreen.classList.remove('active');
                });
            }
        }

        // Gestures
        function setupGestures() {
            const container = document.getElementById('viewerContainer');

            // Touch events
            container.addEventListener('touchstart', handleTouchStart, { passive: true });
            container.addEventListener('touchend', handleTouchEnd, { passive: true });
            container.addEventListener('touchmove', handleTouchMove, { passive: true });

            // Mouse/click for zoom
            imageContent.addEventListener('click', handleClick);
            imageContent.addEventListener('dblclick', handleDoubleClick);
        }

        function handleTouchStart(e) {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchStartTime = Date.now();
            }
        }

        function handleTouchMove(e) {
            if (e.touches.length === 1 && !isZoomed) {
                const diffX = e.touches[0].clientX - touchStartX;
                const diffY = e.touches[0].clientY - touchStartY;
                
                // Horizontal swipe
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                    // Could implement gallery navigation here
                }
                
                // Vertical swipe to close
                if (diffY > 100) {
                    closeViewer();
                }
            }
        }

        function handleTouchEnd(e) {
            const touchDuration = Date.now() - touchStartTime;
            
            // Double tap detection
            const now = Date.now();
            if (now - lastTap < 300) {
                handleDoubleClick(e.changedTouches[0]);
                lastTap = 0;
                return;
            }
            lastTap = now;

            // Long press
            if (touchDuration > 500) {
                showContextMenu();
            }
        }

        function handleClick(e) {
            if (mediaType === 'video') {
                togglePlayPause();
                return;
            }
            
            // Single tap - toggle UI
            const header = document.querySelector('.header');
            const actions = document.querySelector('.actions-bar');
            const captionEl = document.querySelector('.caption');
            
            const isHidden = header.style.opacity === '0';
            header.style.opacity = isHidden ? '1' : '0';
            actions.style.opacity = isHidden ? '1' : '0';
            if (captionEl.textContent) {
                captionEl.classList.toggle('visible', isHidden);
            }
        }

        function handleDoubleClick(e) {
            const rect = imageContent.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (isZoomed) {
                // Zoom out
                imageContent.classList.remove('zoomed');
                imageContent.style.transform = 'scale(1)';
                isZoomed = false;
            } else {
                // Zoom in at point
                imageContent.classList.add('zoomed');
                
                // Calculate transform origin based on tap position
                const percentX = (x / rect.width) * 100;
                const percentY = (y / rect.height) * 100;
                imageContent.style.transformOrigin = `${percentX}% ${percentY}%`;
                imageContent.style.transform = 'scale(2)';
                isZoomed = true;
            }
        }

        // Actions
        function closeViewer() {
            // Check if there's a history state
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // Fallback to chats
                window.location.href = 'chats.html';
            }
        }

        function showContextMenu() {
            // Could show native context menu
            showShareSheet();
        }

        function showShareSheet() {
            document.getElementById('shareOverlay').classList.add('active');
        }

        function hideShareSheet(e) {
            if (!e || e.target.id === 'shareOverlay') {
                document.getElementById('shareOverlay').classList.remove('active');
            }
        }

        async function shareVia(method) {
            hideShareSheet();
            
            switch (method) {
                case 'copy':
                    if (mediaUrl) {
                        await navigator.clipboard.writeText(mediaUrl);
                        showToast('Скопировано');
                    }
                    break;
                case 'save':
                    saveMedia();
                    break;
                case 'messages':
                    showToast('Пересылка скоро');
                    break;
                case 'story':
                    showToast('Истории скоро');
                    break;
            }
        }

        function saveMedia() {
            if (!mediaUrl || mediaUrl.startsWith('data:') || mediaUrl.includes('placeholder.com')) {
                showToast('Невозможно сохранить', '❌');
                return;
            }

            // Create download link
            const a = document.createElement('a');
            a.href = mediaUrl;
            a.download = 'craneapp_' + Date.now();
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            showToast('Сохранено', '✅');
        }

        function replyToMedia() {
            // Send message to parent window
            if (window.opener) {
                window.opener.postMessage({
                    type: 'reply_to_media',
                    messageId: messageId,
                    chatId: chatId,
                    mediaUrl: mediaUrl,
                    mediaType: mediaType
                }, '*');
            }
            closeViewer();
        }

        function deleteMedia() {
            if (!messageId || !chatId) {
                showToast('Невозможно удалить', '❌');
                return;
            }

            if (confirm('Удалить это медиа?')) {
                // Send delete request
                fetch(`/api/v1/messages/${messageId}?forEveryone=true`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('craneapp_auth_token')
                    }
                }).then(() => {
                    showToast('Удалено', '✅');
                    closeViewer();
                }).catch(() => {
                    showToast('Ошибка', '❌');
                });
            }
        }

        function showToast(message, icon = '✓') {
            // Simple toast implementation
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0,0,0,0.9);
                color: #fff;
                padding: 16px 24px;
                border-radius: 12px;
                font-size: 15px;
                z-index: 10000;
                display: flex;
                align-items: center;
                gap: 8px;
            `;
            toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // Keyboard
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'Escape':
                    closeViewer();
                    break;
                case 'ArrowLeft':
                    if (mediaType === 'video') videoContent.currentTime -= 10;
                    break;
                case 'ArrowRight':
                    if (mediaType === 'video') videoContent.currentTime += 10;
                    break;
                case ' ':
                    if (mediaType === 'video') {
                        e.preventDefault();
                        togglePlayPause();
                    }
                    break;
                case '+':
                case '=':
                    if (!isZoomed) {
                        imageContent.classList.add('zoomed');
                        imageContent.style.transform = 'scale(2)';
                        isZoomed = true;
                    }
                    break;
                case '-':
                    if (isZoomed) {
                        imageContent.classList.remove('zoomed');
                        imageContent.style.transform = 'scale(1)';
                        isZoomed = false;
                    }
                    break;
            }
        });

        // Initialize on load
        init();
    </script>
</body>
</html>
