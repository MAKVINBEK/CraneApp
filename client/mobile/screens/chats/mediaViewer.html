<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Просмотр - CraneApp</title>
    <script src="/client/mobile/scripts/i18n.js"></script>
<link rel="stylesheet" href="./mediaViewer.css">
</head>
<body>
    <div class="viewer-container" id="viewerContainer">
        <!-- Header -->
        <div class="header">
            <button class="header-btn" onclick="closeViewer()" title="Закрыть">✕</button>
            <div class="header-title" id="headerTitle">Медиа</div>
            <button class="header-btn" onclick="showShareSheet()" title="Поделиться">📤</button>
        </div>

        <!-- Media Content -->
        <div class="media-wrapper" id="mediaWrapper">
            <div class="loading" id="loadingIndicator">
                <div class="spinner"></div>
                <div class="loading-text">Загрузка...</div>
            </div>
            
            <img class="media-content zoomable" id="imageContent" style="display:none" alt="Media">
            <video class="media-content" id="videoContent" style="display:none" playsinline></video>
        </div>

        <!-- Video Progress & Time -->
        <div class="video-time" id="videoTime" style="display:none">0:00 / 0:00</div>

        <!-- Gallery Dots -->
        <div class="gallery-dots" id="galleryDots" style="display:none"></div>

        <!-- Caption -->
        <div class="caption" id="caption"></div>

        <!-- Fullscreen Video -->
        <div class="fullscreen-video" id="fullscreenVideo">
            <button class="fullscreen-close" onclick="toggleFullscreen()">✕</button>
            <video id="fullscreenVideoElement" playsinline></video>
        </div>

        <!-- Share Sheet -->
        <div class="share-overlay" id="shareOverlay" onclick="hideShareSheet(event)">
            <div class="share-sheet" onclick="event.stopPropagation()">
                <div class="share-sheet-title">Поделиться</div>
                <div class="share-options">
                    <button class="share-option" onclick="shareVia('messages')">
                        <span class="share-option-icon">💬</span>
                        <span class="share-option-label">Чат</span>
                    </button>
                    <button class="share-option" onclick="shareVia('story')">
                        <span class="share-option-icon">📱</span>
                        <span class="share-option-label">История</span>
                    </button>
                    <button class="share-option" onclick="shareVia('copy')">
                        <span class="share-option-icon">📋</span>
                        <span class="share-option-label">Копировать</span>
                    </button>
                    <button class="share-option" onclick="shareVia('save')">
                        <span class="share-option-icon">⬇️</span>
                        <span class="share-option-label">Сохранить</span>
                    </button>
                </div>
                <button class="share-cancel" onclick="hideShareSheet()">Отмена</button>
            </div>
        </div>

        <!-- Actions Bar -->
        <div class="actions-bar">
            <button class="action-btn" onclick="replyToMedia()">
                ↩️<span>Ответить</span>
            </button>
            <button class="action-btn" onclick="showShareSheet()">
                ⏩<span>Переслать</span>
            </button>
            <button class="action-btn" onclick="saveMedia()">
                ⬇️<span>Сохранить</span>
            </button>
            <button class="action-btn danger" onclick="deleteMedia()">
                🗑️<span>Удалить</span>
            </button>
        </div>
    </div>

    <script src="./mediaViewer.js"></script>
</body>
</html>
