<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title >CraneApp - Чат</title>
    <script src="/client/mobile/scripts/i18n.js"></script>
    <script src="/client/mobile/scripts/theme.js"></script>
    <link rel="stylesheet" href="./chat.css">
</head>
<body>
    <div class="app-wrapper">
        <div class="header">
            <button class="back-btn" onclick="history.back()">←</button>
            <div class="chat-avatar" id="chatAvatar">🤖</div>
            <div class="chat-info">
                <div class="chat-name" id="chatName" data-i18n="loading">Загрузка...</div>
                <div class="chat-status" data-i18n="online">онлайн</div>
            </div>
        </div>
        <div class="messages-area" id="messages"></div>
        <div class="input-area">
            <button style="background:none;border:none;font-size:20px;cursor:pointer;">📎</button>
            <label for="msgInput"></label><input type="text" class="msg-input" placeholder="" id="msgInput">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script src="./chat.js"></script>
</body>
</html>
