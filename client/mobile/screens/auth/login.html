<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CraneApp - Вход</title>
    <script src="../../scripts/apple-emoji.js"></script>
    <style>
        :root {
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            overflow-x: hidden;
        }
        
        body {
            background-color: #0a0a0a;
            color: #FFFFFF;
            font-family: system-ui, -apple-system, -apple-system-body, sans-serif;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--safe-area-top) 0 var(--safe-area-bottom);
            background-image: radial-gradient(circle at 50% 50%, rgba(255,0,127,0.05) 0%, transparent 50%);
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            padding: 24px 20px;
            margin: 16px;
            background: rgba(18, 18, 18, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        @media (min-width: 768px) {
            .container {
                padding: 40px;
                border-radius: 24px;
            }
        }
        
        .logo-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(255,0,127,0.2), rgba(157,0,255,0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 16px 48px rgba(255,0,127,0.3);
            animation: logoGlow 3s ease-in-out infinite;
        }
        
        @media (min-width: 768px) {
            .logo-container {
                width: 120px;
                height: 120px;
                border-radius: 30px;
                margin-bottom: 24px;
            }
        }
        
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        @keyframes logoGlow {
            0%, 100% { box-shadow: 0 16px 48px rgba(255,0,127,0.3); }
            50% { box-shadow: 0 16px 64px rgba(255,0,127,0.5), 0 0 80px rgba(157,0,255,0.3); }
        }
        
        h1 {
            text-align: center;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #FF007F, #9D00FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 26px;
            font-weight: 800;
        }
        
        @media (min-width: 768px) {
            h1 { font-size: 32px; margin-bottom: 8px; }
        }
        
        .subtitle {
            text-align: center;
            color: #B0B0B0;
            margin-bottom: 24px;
            font-size: 14px;
        }
        
        @media (min-width: 768px) {
            .subtitle { font-size: 15px; margin-bottom: 32px; }
        }
        
        .input-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 6px; color: #B0B0B0; font-size: 13px; }
        
        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #333;
            background: #1E1E1E;
            color: #FFFFFF;
            font-size: 15px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        
        input:focus { border-color: #FF007F; }
        input::placeholder { color: #666; }
        
        .eye-btn{position:absolute;right:14px;bottom:14px;background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;padding:4px;width:auto;margin:0;font-size:0}
        .eye-btn:active{color:rgba(255,255,255,0.8)}
        
        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #FF007F, #9D00FF);
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            -webkit-appearance: none;
            appearance: none;
        }
        
        button:active { opacity: 0.85; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #666666;
            font-size: 14px;
        }
        
        .footer a { color: #FF007F; text-decoration: none; }
        .footer a:active { text-decoration: underline; }
        
        .toast-container {
            position: fixed;
            bottom: calc(20px + var(--safe-area-bottom));
            left: 12px;
            right: 12px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }
        
        @media (min-width: 768px) {
            .toast-container { left: auto; right: 20px; }
        }
        
        .toast {
            padding: 12px 16px;
            background: #1E1E1E;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: slideIn 0.3s ease;
            border-left: 4px solid #FF4B4B;
            font-size: 14px;
        }
        
        .toast.success { border-left-color: #00FF88; }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>
    
    <div class="container">
        <div class="logo-container">
            <img src="https://i.ibb.co/1Y4Pg7BF/94-20260317155000.png" alt="CraneApp Logo">
        </div>
        
        <h1>CraneApp</h1>
        <p class="subtitle">Войдите в аккаунт</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Юзернейм</label>
                <input type="text" id="username" placeholder="@username" required autocomplete="username" autocapitalize="none" autocorrect="off">
            </div>
            <div class="input-group">
                <label for="password">Пароль</label>
                <div style="position:relative;display:block">
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" style="padding-right:44px">
                    <button type="button" class="eye-btn" onclick="toggleLoginEye(event)">
                    <svg id="loginEye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <button type="submit" id="loginBtn">Войти</button>
        </form>
        
        <div class="footer">
            Нет аккаунта? <a href="./register.html">Зарегистрироваться</a>
        </div>
    </div>

    <script>
        // Проверка: если уже залогинен → сразу в чаты
        const existingToken = localStorage.getItem('craneapp_auth_token');
        if (existingToken) {
            window.location.href = '/client/mobile/screens/chats/chats.html';
        }

        // Функция загрузки настроек с сервера
        async function fetchUserSettings(token) {
            try {
                const res = await fetch('/api/v1/users/settings', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    const data = await res.json();
                    return data.settings;
                }
            } catch (e) {
                console.error('Failed to fetch settings:', e);
            }
            return { theme: 'dark', notifications: true, sounds: true };
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            
            btn.disabled = true;
            btn.textContent = 'Вход...';

            try {
                // Получаем публичный IP для уведомления о входе
                let clientIP = '';
                try {
                    const ipRes = await fetch('https://api.ipify.org?format=json');
                    if (ipRes.ok) { const d = await ipRes.json(); clientIP = d.ip || ''; }
                } catch (_) {}

                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, clientIP })
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    throw new Error(data.error || 'Ошибка входа');
                }

                // 2FA — требуется доп. пароль
                if (data.twoFARequired) {
                    btn.disabled = false;
                    btn.textContent = 'Войти';
                    const twoFAPwd = prompt('Введите дополнительный пароль (2FA):');
                    if (!twoFAPwd) return;

                    btn.disabled = true;
                    btn.textContent = 'Проверка 2FA...';

                    const res2 = await fetch('/api/v1/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password, twoFAPassword: twoFAPwd, clientIP })
                    });
                    const data2 = await res2.json();
                    if (!res2.ok) throw new Error(data2.error || 'Неверный доп. пароль');
                    Object.assign(data, data2);
                }
                
                if (data.token) {
                    // Сохраняем токен
                    localStorage.setItem('craneapp_auth_token', data.token);
                    
                    // Сохраняем данные пользователя из ответа
                    const user = data.user;
                    localStorage.setItem('craneapp_user_data', JSON.stringify({
                        id: user.id,
                        username: user.username,
                        firstName: user.firstName,
                        lastName: user.lastName || '',
                        bio: user.bio || '',
                        avatarUrl: user.avatarUrl || ''
                    }));
                    
                    // Загружаем настройки
                    btn.textContent = 'Загрузка...';
                    const settings = await fetchUserSettings(data.token);
                    localStorage.setItem('craneapp_settings', JSON.stringify(settings));
                    
                    showToast('success', 'Вход выполнен!', '✓');
                    
                    setTimeout(function() {
                        window.location.href = '/client/mobile/screens/chats/chats.html';
                    }, 500);
                } else {
                    throw new Error('Неверный формат ответа');
                }
            } catch (err) {
                console.error('Login error:', err);
                showToast('error', err.message, '❌');
                btn.disabled = false;
                btn.textContent = 'Войти';
            }
        });

        function showToast(type, message, icon) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.innerHTML = '<span>' + icon + '</span><span>' + message + '</span>';
            container.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                setTimeout(function() { toast.remove(); }, 300);
            }, 3000);
        }
        function toggleLoginEye(e) {
            e.preventDefault();
            const inp = document.getElementById('password');
            const eye = document.getElementById('loginEye');
            if (inp.type === 'password') {
                inp.type = 'text';
                eye.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
            } else {
                inp.type = 'password';
                eye.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
        }
    </script>
</body>
</html>
