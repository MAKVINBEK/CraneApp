<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CraneApp - Подтверждение</title>
    <script src="/client/mobile/scripts/i18n.js"></script>
<link rel="stylesheet" href="./phoneVerification.css">
</head>
<body>
    <div class="auth-container">
        <div class="logo-container">
            <img src="https://i.ibb.co/1Y4Pg7BF/94-20260317155000.png" alt="CraneApp Logo">
        </div>
        <h1 class="title" data-i18n="phoneVerification">Подтверждение</h1>
        <p class="subtitle" data-i18n="smsCodePrompt">Введите код из SMS</p>
        
        <div class="code-inputs" id="codeInputs">
            <input type="tel" class="code-input" maxlength="1" />
            <input type="tel" class="code-input" maxlength="1" />
            <input type="tel" class="code-input" maxlength="1" />
            <input type="tel" class="code-input" maxlength="1" />
            <input type="tel" class="code-input" maxlength="1" />
            <input type="tel" class="code-input" maxlength="1" />
        </div>

        <button id="verifyBtn" class="verify-btn" data-i18n="verify">Подтвердить</button>
        <div class="resend" id="resendBtn" data-i18n="resendCode">Отправить код повторно</div>
    </div>

    <script src="./phoneVerification.js"></script>
</body>
</html>
