<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraneApp — Доступ заблокирован</title>

    <link rel="stylesheet" href="./blocked.css">
</head>
<body>
<div class="card">
  <div class="logo">CraneApp</div>
  <span class="emoji-wrap">🚫</span>
  <div class="status-badge"><div class="status-dot"></div><span id="badgeText">Заблокировано</span></div>
  <h1 id="title">Доступ временно закрыт</h1>
  <p id="desc">Твой IP был временно заблокирован из-за подозрительной активности. Подожди немного.</p>
  <div class="timer-wrap" id="timerWrap">
    <div class="timer-ring">
      <svg width="100" height="100" viewBox="0 0 100 100">
        <circle class="ring-bg" cx="50" cy="50" r="44"/>
        <circle class="ring-bar" id="ringBar" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-num" id="timerNum">—</div>
    </div>
    <div class="timer-label" id="timerLabel">секунд до разблокировки</div>
  </div>
  <button class="btn" id="btn" onclick="goBack()" disabled>Вернуться назад</button>
</div>
<script src="./blocked.js"></script>
</body>
</html>
