<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraneApp — Сервер недоступен</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --accent: #FF007F; --accent2: #9D00FF; }

  body {
    min-height: 100vh;
    background: #0a0a0a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 30%, rgba(255,0,127,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 35% at 80% 70%, rgba(157,0,255,0.10) 0%, transparent 60%);
    animation: bgPulse 4s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes bgPulse {
    from { opacity: 0.6; }
    to   { opacity: 1; }
  }

  .card {
    position: relative;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 28px;
    padding: 48px 40px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(20px);
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(32px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .emoji-wrap {
    font-size: 72px;
    line-height: 1;
    margin-bottom: 8px;
    animation: shake 2.5s ease-in-out infinite;
    display: block;
  }
  @keyframes shake {
    0%,100% { transform: rotate(0deg); }
    15%      { transform: rotate(-8deg); }
    30%      { transform: rotate(6deg); }
    45%      { transform: rotate(-4deg); }
    60%      { transform: rotate(3deg); }
    75%      { transform: rotate(-2deg); }
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,75,75,0.15);
    border: 1px solid rgba(255,75,75,0.3);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 600;
    color: #FF6B6B;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #FF6B6B;
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  p {
    font-size: 15px;
    color: rgba(255,255,255,0.55);
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .retry-btn {
    width: 100%;
    padding: 16px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: -0.01em;
    box-shadow: 0 8px 32px rgba(255,0,127,0.35);
    transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .retry-btn:active { transform: scale(0.96); box-shadow: 0 4px 16px rgba(255,0,127,0.2); }
  .retry-btn.loading { opacity: 0.7; pointer-events: none; }

  .divider {
    height: 1px;
    background: rgba(255,255,255,0.07);
    margin: 24px 0;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    margin-bottom: 8px;
  }
  .info-row span:last-child { color: rgba(255,255,255,0.6); font-weight: 500; }

  .countdown {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    margin-top: 16px;
  }
  .countdown b { color: rgba(255,255,255,0.6); }

  .logo {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">CraneApp</div>

  <span class="emoji-wrap">😭</span>

  <div class="status-badge">
    <div class="status-dot"></div>
    Сервер недоступен
  </div>

  <h1>Что-то пошло не так</h1>
  <p>Сервер временно недоступен или ведутся технические работы. Мы уже знаем об этом и работаем над исправлением.</p>

  <button class="retry-btn" id="retryBtn" onclick="retry()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    Попробовать снова
  </button>

  <div class="countdown" id="countdown"></div>

  <div class="divider"></div>

  <div class="info-row">
    <span>Статус</span>
    <span id="statusText">Проверка...</span>
  </div>
  <div class="info-row">
    <span>Последняя проверка</span>
    <span id="lastCheck">—</span>
  </div>
  <div class="info-row">
    <span>Попыток</span>
    <span id="attempts">0</span>
  </div>
</div>

<script>
  let attempts = 0;
  let countdownTimer = null;
  let autoRetryIn = 15;

  function updateTime() {
    document.getElementById('lastCheck').textContent =
      new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  async function retry() {
    const btn = document.getElementById('retryBtn');
    btn.classList.add('loading');
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 0.8s linear infinite"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Проверяем...';

    attempts++;
    document.getElementById('attempts').textContent = attempts;
    updateTime();
    clearCountdown();

    try {
      const res = await fetch('/api/v1/health', { cache: 'no-store', signal: AbortSignal.timeout(5000) });
      if (res.ok) {
        document.getElementById('statusText').textContent = '✅ Онлайн';
        btn.innerHTML = '✅ Сервер работает! Перезагрузка...';
        setTimeout(() => {
          const prev = sessionStorage.getItem('crane_pre_error_url');
          window.location.href = prev || '/client/mobile/screens/chats/chats.html';
        }, 800);
        return;
      }
    } catch (_) {}

    document.getElementById('statusText').textContent = '❌ Недоступен';
    btn.classList.remove('loading');
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Попробовать снова';
    startCountdown(15);
  }

  function startCountdown(sec) {
    autoRetryIn = sec;
    const el = document.getElementById('countdown');
    clearCountdown();
    countdownTimer = setInterval(() => {
      autoRetryIn--;
      el.innerHTML = 'Автоматическая проверка через <b>' + autoRetryIn + '</b> сек';
      if (autoRetryIn <= 0) {
        clearCountdown();
        el.textContent = '';
        retry();
      }
    }, 1000);
  }

  function clearCountdown() {
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    document.getElementById('countdown').textContent = '';
  }

  // Добавляем анимацию спиннера
  const style = document.createElement('style');
  style.textContent = '@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }';
  document.head.appendChild(style);

  // Сохраняем откуда пришли
  if (document.referrer && !document.referrer.includes('server-down')) {
    sessionStorage.setItem('crane_pre_error_url', document.referrer);
  }

  // Первая проверка и автозапуск
  updateTime();
  document.getElementById('statusText').textContent = '❌ Недоступен';
  startCountdown(15);
</script>
</body>
</html>
