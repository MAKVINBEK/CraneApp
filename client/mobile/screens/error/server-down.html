<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraneApp — Сервер недоступен</title>
    <script src="/client/mobile/scripts/i18n.js"></script>
<link rel="stylesheet" href="./server-down.css">
</head>
<body>
<div class="card">
  <div class="logo">CraneApp</div>

  <span class="emoji-wrap">😭</span>

  <div class="status-badge">
    <div class="status-dot"></div>
    <span data-i18n="serverDownTitle">Сервер недоступен</span>
  </div>

  <h1 data-i18n="serverDownHeadline">Что-то пошло не так</h1>
  <p data-i18n="serverDownDesc">Сервер временно недоступен или ведутся технические работы. Мы уже знаем об этом и работаем над исправлением.</p>

  <button class="retry-btn" id="retryBtn" onclick="retry()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    <span data-i18n="retryAgain">Попробовать снова</span>
  </button>

  <div class="countdown" id="countdown"></div>

  <div class="divider"></div>

  <div class="info-row">
    <span data-i18n="statusLabel">Статус</span>
    <span id="statusText" data-i18n="checking">Проверка...</span>
  </div>
  <div class="info-row">
    <span data-i18n="lastCheckLabel">Последняя проверка</span>
    <span id="lastCheck">—</span>
  </div>
  <div class="info-row">
    <span data-i18n="attemptsLabel">Попыток</span>
    <span id="attempts">0</span>
  </div>
</div>

<script src="./server-down.js"></script>
</body>
</html>
