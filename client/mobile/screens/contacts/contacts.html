<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты - CraneApp</title>
    
    <script src="../../scripts/theme.js"></script>
    
    
    <link rel="stylesheet" href="./contacts.css">
</head>
<body>
    <div class="header">
        <span class="header-title">Контакты</span>
        <button class="header-btn" onclick="location.href='./search.html'">🔍</button>
    </div>
    
    <!-- Баннер поиска -->
    <div class="search-banner" onclick="location.href='./search.html'">
        <div class="search-icon">🔍</div>
        <div class="search-text">
            <div class="search-title">Найти пользователя</div>
            <div class="search-subtitle">Поиск по юзернейму</div>
        </div>
        <div style="color:var(--text-muted);">›</div>
    </div>
    
    <!-- Список контактов -->
    <div class="contacts-list">
        <div class="contact-item" onclick="openChat('craneapp_bot')">
            <div class="contact-avatar">🤖</div>
            <div>
                <div class="contact-name">CraneApp Bot</div>
                <div class="contact-status">официальный бот ✓</div>
            </div>
        </div>
    </div>
    
    <div class="tab-bar" id="tabBar"></div>

    <script src="./contacts.js"></script>
</body>
</html>
