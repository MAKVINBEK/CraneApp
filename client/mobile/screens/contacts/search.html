<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск - CraneApp</title>
    <script src="/client/mobile/scripts/i18n.js"></script>
<link rel="stylesheet" href="./search.css">
</head>
<body>
    <div class="header">
        <button class="back" onclick="history.back()">←</button>
        <h2>Поиск пользователей</h2>
    </div>
    
    <div class="search-hint">
        💡 Введите юзернейм (минимум 2 символа)
    </div>
    
    <div class="search-container">
        <input type="text" class="search-input" placeholder="@username" id="searchInput" autocomplete="off">
    </div>
    
    <div class="search-status" id="searchStatus"></div>
    
    <div class="results" id="results">
        <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <div>Введите юзернейм для поиска</div>
        </div>
    </div>

    <script src="./search.js"></script>
</body>
</html>
