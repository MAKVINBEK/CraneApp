<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - CraneApp</title>
    <script src="/client/mobile/scripts/i18n.js"></script>
    <script src="/client/mobile/scripts/theme.js"></script>
    <link rel="stylesheet" href="./profile.css">
</head>
<body>
    <div class="app-wrapper">
        <div class="header">
            <button class="back-btn" onclick="history.back()">←</button>
            <span style="font-weight: 600; font-size: 18px;" id="profileTitle">Профиль</span>
        </div>
        <div class="profile-header">
            <div class="avatar" id="avatar">👤</div>
            <div class="name" id="name" data-i18n="loading">Загрузка...</div>
            <div class="username" id="username">@username</div>
            <div class="status" id="status" data-i18n="online">онлайн</div>
        </div>
        <div class="actions">
            <button class="action-btn btn-primary" onclick="window.location.href='../chats/chat.html?id=new'" id="messageBtn">💬 Сообщение</button>
            <button class="action-btn btn-secondary" onclick="alert('Звонок')" id="callBtn">📞 Звонок</button>
        </div>
        <div class="info-section">
            <div class="info-item"><span class="info-label" data-i18n="name">Имя</span><span class="info-value" id="displayName">-</span></div>
            <div class="info-item"><span class="info-label" data-i18n="aboutMe">О себе</span><span class="info-value" id="bio">Нет информации</span></div>
            <div class="info-item" onclick="location.href('./editProfile.html')"><span class="info-label" data-i18n="editProfile">Изменить профиль</span><span class="arrow">›</span></div>
        </div>
        <div class="info-section">
            <div class="info-item" onclick="location.href('../settings/privacy.html')"><span class="info-label" data-i18n="privacy">Конфиденциальность</span><span class="arrow">›</span></div>
            <div class="info-item" onclick="alert('Уведомления')"><span class="info-label" data-i18n="notifications">Уведомления</span><span class="arrow">›</span></div>
        </div>
    </div>

    <script src="./profile.js"></script>
</body>
</html>
