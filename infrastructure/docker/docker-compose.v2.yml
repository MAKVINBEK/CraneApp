services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: craneapp
      POSTGRES_USER: craneapp
      POSTGRES_PASSWORD: craneapp-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craneapp -d craneapp"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_v2:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats_v2:/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_v2:/data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: craneapp
      MINIO_ROOT_PASSWORD: craneapp-local-secret
    ports:
      - "9001:9001"
    volumes:
      - minio_v2:/data

  crypto:
    build:
      context: ../../server/crypto-rust
    environment:
      CRYPTO_SIGNING_SECRET: local-signing-secret-change-me-32-chars
      CRYPTO_ENCRYPTION_SECRET: local-encryption-secret-change-me-32-chars
  migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: craneapp-local
    volumes:
      - ../../backend-v2/migrations:/migrations:ro
    command: ["/bin/sh", "-c", "for migration in /migrations/*.sql; do psql -h postgres -U craneapp -d craneapp -v ON_ERROR_STOP=1 -f $$migration; done"]
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    build:
      context: ../../backend-v2
      args:
        SERVICE: auth
    environment:
      DATABASE_URL: postgres://craneapp:craneapp-local@postgres:5432/craneapp?sslmode=disable
      CRYPTO_URL: http://crypto:5005
    depends_on:
      migrate:
        condition: service_completed_successfully
      crypto:
        condition: service_started

  user:
    build:
      context: ../../backend-v2
      args:
        SERVICE: user
    environment:
      DATABASE_URL: postgres://craneapp:craneapp-local@postgres:5432/craneapp?sslmode=disable
      CRYPTO_URL: http://crypto:5005
    depends_on:
      migrate:
        condition: service_completed_successfully
      crypto:
        condition: service_started

  chat:
    build:
      context: ../../backend-v2
      args:
        SERVICE: chat
    environment:
      DATABASE_URL: postgres://craneapp:craneapp-local@postgres:5432/craneapp?sslmode=disable
      CRYPTO_URL: http://crypto:5005
      NATS_URL: nats://nats:4222
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      crypto:
        condition: service_started
      nats:
        condition: service_started

  media:
    build:
      context: ../../backend-v2
      args:
        SERVICE: media
    environment:
      DATABASE_URL: postgres://craneapp:craneapp-local@postgres:5432/craneapp?sslmode=disable
      CRYPTO_URL: http://crypto:5005
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: craneapp
      MINIO_SECRET_KEY: craneapp-local-secret
      MINIO_REGION: us-east-1
      MEDIA_BUCKET: crane-media
    depends_on:
      migrate:
        condition: service_completed_successfully
      crypto:
        condition: service_started
      minio:
        condition: service_started

  admin:
    build:
      context: ../../backend-v2
      args:
        SERVICE: admin
    environment:
      DATABASE_URL: postgres://craneapp:craneapp-local@postgres:5432/craneapp?sslmode=disable
      CRYPTO_URL: http://crypto:5005
    depends_on:
      migrate:
        condition: service_completed_successfully
      crypto:
        condition: service_started

  edge:
    build:
      context: ../../backend-v2
      args:
        SERVICE: edge
    environment:
      AUTH_URL: http://auth:8081
      USER_URL: http://user:8082
      CHAT_URL: http://chat:8083
      MEDIA_URL: http://media:8084
      ADMIN_URL: http://admin:8085
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      CRANE_ENV: production
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - user
      - chat
      - media
      - admin

volumes:
  postgres_v2:
  nats_v2:
  redis_v2:
  minio_v2:
