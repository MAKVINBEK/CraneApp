apiVersion: v1
kind: Namespace
metadata:
  name: craneapp-v2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto
  namespace: craneapp-v2
spec:
  replicas: 2
  selector:
    matchLabels: { app: crypto }
  template:
    metadata:
      labels: { app: crypto }
    spec:
      containers:
        - name: crypto
          image: craneapp/crypto:v2
          ports:
            - { name: http, containerPort: 5005 }
          env:
            - name: CRYPTO_SIGNING_SECRET
              valueFrom: { secretKeyRef: { name: crypto-secrets, key: signing-secret } }
            - name: CRYPTO_ENCRYPTION_SECRET
              valueFrom: { secretKeyRef: { name: crypto-secrets, key: encryption-secret } }
          readinessProbe: { httpGet: { path: /health/ready, port: http } }
          livenessProbe: { httpGet: { path: /health/live, port: http } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: crypto
  namespace: craneapp-v2
spec:
  selector: { app: crypto }
  ports:
    - { name: http, port: 5005, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: craneapp-v2
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth, crypto-client: "true" }
    spec:
      containers:
        - name: auth
          image: craneapp/auth:v2
          ports:
            - { name: http, containerPort: 8081 }
          env:
            - { name: CRYPTO_URL, value: "http://crypto:5005" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: database-secrets, key: url } }
          readinessProbe: { httpGet: { path: /health/ready, port: http } }
          livenessProbe: { httpGet: { path: /health/live, port: http } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: craneapp-v2
spec:
  selector: { app: auth }
  ports:
    - { name: http, port: 8081, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: craneapp-v2
spec:
  replicas: 2
  selector:
    matchLabels: { app: edge }
  template:
    metadata:
      labels: { app: edge }
    spec:
      containers:
        - name: edge
          image: craneapp/edge:v2
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: AUTH_URL, value: "http://auth:8081" }
            - { name: USER_URL, value: "http://user:8082" }
            - { name: CHAT_URL, value: "http://chat:8083" }
            - { name: ALLOWED_ORIGINS, value: "https://web.craneapp.ru" }
          readinessProbe: { httpGet: { path: /health/live, port: http } }
          livenessProbe: { httpGet: { path: /health/live, port: http } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: craneapp-v2
spec:
  selector: { app: edge }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  namespace: craneapp-v2
spec:
  replicas: 2
  selector:
    matchLabels: { app: chat }
  template:
    metadata:
      labels: { app: chat, crypto-client: "true" }
    spec:
      containers:
        - name: chat
          image: craneapp/chat:v2
          ports:
            - { name: http, containerPort: 8083 }
          env:
            - { name: CRYPTO_URL, value: "http://crypto:5005" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: database-secrets, key: url } }
          readinessProbe: { httpGet: { path: /health/ready, port: http } }
          livenessProbe: { httpGet: { path: /health/live, port: http } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: chat
  namespace: craneapp-v2
spec:
  selector: { app: chat }
  ports:
    - { name: http, port: 8083, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: craneapp-v2
spec:
  replicas: 2
  selector:
    matchLabels: { app: user }
  template:
    metadata:
      labels: { app: user, crypto-client: "true" }
    spec:
      containers:
        - name: user
          image: craneapp/user:v2
          ports:
            - { name: http, containerPort: 8082 }
          env:
            - { name: CRYPTO_URL, value: "http://crypto:5005" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: database-secrets, key: url } }
          readinessProbe: { httpGet: { path: /health/ready, port: http } }
          livenessProbe: { httpGet: { path: /health/live, port: http } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: craneapp-v2
spec:
  selector: { app: user }
  ports:
    - { name: http, port: 8082, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crypto-ingress
  namespace: craneapp-v2
spec:
  podSelector:
    matchLabels: { app: crypto }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { crypto-client: "true" }
      ports:
        - { protocol: TCP, port: 5005 }
