syntax = "proto3";

package crane.events.v1;

option go_package = "craneapp/backend-v2/gen/events/v1;eventsv1";

message EventEnvelope {
  string event_id = 1;
  string event_type = 2;
  string occurred_at = 3;
  string producer = 4;
  string trace_id = 5;
  bytes payload = 6;
}

message UserProfileUpdated {
  string user_id = 1;
  string username = 2;
}

message UserBlocked {
  string user_id = 1;
  string blocked_user_id = 2;
}

message ChatCreated {
  string chat_id = 1;
  string chat_type = 2;
  string owner_id = 3;
}

message ChatMemberChanged {
  string chat_id = 1;
  string user_id = 2;
  string change = 3;
}
