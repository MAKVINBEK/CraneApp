syntax = "proto3";

package crane.crypto.v1;

option go_package = "craneapp/backend-v2/gen/crypto/v1;cryptov1";

service CryptoService {
  rpc HashPassword(HashPasswordRequest) returns (HashPasswordResponse);
  rpc VerifyPassword(VerifyPasswordRequest) returns (VerifyPasswordResponse);
  rpc IssueToken(IssueTokenRequest) returns (IssueTokenResponse);
  rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenResponse);
  rpc Encrypt(EncryptRequest) returns (EncryptResponse);
  rpc Decrypt(DecryptRequest) returns (DecryptResponse);
}

message HashPasswordRequest { string password = 1; }
message HashPasswordResponse { string hash = 1; }
message VerifyPasswordRequest { string password = 1; string hash = 2; }
message VerifyPasswordResponse { bool valid = 1; }
message IssueTokenRequest { string subject = 1; string username = 2; }
message IssueTokenResponse { string token = 1; int64 expires_at = 2; }
message VerifyTokenRequest { string token = 1; }
message VerifyTokenResponse { string subject = 1; string username = 2; int64 issued_at = 3; int64 expires_at = 4; }
message EncryptRequest { bytes plaintext = 1; bytes associated_data = 2; }
message EncryptResponse { bytes ciphertext = 1; }
message DecryptRequest { bytes ciphertext = 1; bytes associated_data = 2; }
message DecryptResponse { bytes plaintext = 1; }
