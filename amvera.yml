meta:
  environment: nodejs
  toolchain:
    name: npm
    version: "20"
build:
  skip: false
  additionalCommands: null
  artifacts:
    "*": /
run:
  scriptName: null
  scriptArguments: null
  nodeArguments: "\t--max-old-space-size=512"
  command: npm run start
  persistenceMount: /app/uploads
  containerPort: "3000"
  servicePort: "80"
