[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:minio]
command=/usr/local/bin/minio server /data/minio --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
environment=MINIO_ROOT_USER="craneapp",MINIO_ROOT_PASSWORD="craneapp2024"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=5

[program:nats]
command=/usr/local/bin/nats-server -p 4222
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=5

[program:crypto]
command=/usr/local/bin/crypto-rust
environment=CRYPTO_SIGNING_SECRET="%(ENV_JWT_SECRET)s",CRYPTO_ENCRYPTION_SECRET="%(ENV_CRYPTO_ENCRYPTION_SECRET)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:auth]
command=/usr/local/bin/auth
environment=AUTH_ADDR=":8081",DATABASE_URL="%(ENV_DATABASE_URL)s",CRYPTO_URL="http://127.0.0.1:5005"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
startretries=10
startsecs=2

[program:user]
command=/usr/local/bin/user
environment=USER_ADDR=":8082",DATABASE_URL="%(ENV_DATABASE_URL)s",CRYPTO_URL="http://127.0.0.1:5005"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
startretries=10
startsecs=2

[program:chat]
command=/usr/local/bin/chat
environment=CHAT_ADDR=":8083",DATABASE_URL="%(ENV_DATABASE_URL)s",CRYPTO_URL="http://127.0.0.1:5005",NATS_URL="nats://127.0.0.1:4222",CRANE_ENV="production"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
startretries=10
startsecs=2

[program:media]
command=/usr/local/bin/media
environment=MEDIA_ADDR=":8084",DATABASE_URL="%(ENV_DATABASE_URL)s",CRYPTO_URL="http://127.0.0.1:5005",MINIO_ENDPOINT="http://127.0.0.1:9000",MINIO_ACCESS_KEY="craneapp",MINIO_SECRET_KEY="craneapp2024",MINIO_BUCKET="craneapp-media"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
startretries=10
startsecs=2

[program:edge]
command=/usr/local/bin/edge
environment=EDGE_ADDR=":8080",AUTH_URL="http://127.0.0.1:8081",USER_URL="http://127.0.0.1:8082",CHAT_URL="http://127.0.0.1:8083",MEDIA_URL="http://127.0.0.1:8084",FRONTEND_DIR="/dist",ALLOWED_ORIGINS="%(ENV_ALLOWED_ORIGINS)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
startretries=10
startsecs=2
